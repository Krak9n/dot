unbind C-b
set -g prefix C-a
bind C-a send-prefix

# vi mode keys
setw -g mode-keys vi
set -g history-limit 10000

bind r source-file ~/.config/tmux/tmux.conf

set -g mouse on 

bind q killp
bind Q killw
bind C-Q kill-session

# Layout
bind h split-window -h
bind v split-window -v

# VI-like copy-paste
# C-a [ -> to enter copy-mode 
set-option -sg set-clipboard off
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

unbind -T copy-mode-vi Enter
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancle "wl-copy"
bind P paste-buffer

# VIM-like pane resizing
bind -r C-h resize-pane -L
bind -r C-j resize-pane -D
bind -r C-k resize-pane -U
bind -r C-l resize-pane -R
# And pane switching
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Status line
set-option -g status-position bottom
set -g status-bg "color232"   
set -g status-fg "color15" 
set -g status-right-style 'fg=black bg=color93'
set -g status-right ""    
set -g status-left ' '
set -g status-left-length 10

set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none
